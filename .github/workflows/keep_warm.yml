name: 앱 서버 데워두기

# 2026-10-30(사용자 결정): 앱 저장소를 비공개로 돌리면 Actions 무료 시간(월 2,000분)이 생긴다 → 비밀 값이 없는
# 이 작업은 공개 저장소(홈페이지)로 옮겨 무료로 돌린다. 시간대별(사용자 지시 10-30): 주간 KST 07:00~23:40 20분마다,
# 심야 KST 00:00~06:40 40분마다.
# 2026-11-25(사용자 승인): 그래도 예약이 6시간씩 빠짐 → 끝날 때 자기 자신을 바로 다시 시작(이어달리기).
#   GITHUB_TOKEN 으로 부른 workflow_dispatch 는 새 실행이 만들어짐(GitHub 예외 규칙). 예약은 이어달리기가 끊겼을 때의 예비.
#   멈추려면: 홈페이지 저장소 Actions → '앱 서버 데워두기' → Disable workflow.
# 2026-11-24(사용자 승인 — 첫 화면 20초 사고): GitHub 예약이 자주 빠져 하루 4번만 돌았다(11-23 22시~11-24 06시 UTC).
# → 예약 1번이 '오래 도는 한 작업'으로 약 5시간 50분 동안 위 간격대로 계속 데운다. 예약은 2시간마다라 몇 번 빠져도
#   앞 작업이 이어서 덮는다(새 작업이 시작되면 앞 작업은 취소 — 겹치지 않음). 공개 저장소라 실행 시간 무료.
on:
  schedule:
    - cron: "13 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write   # 끝날 때 자기 자신을 다시 시작(아래 마지막 단계)

concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  warm:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/keep_warm.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q playwright==1.48.0 && python -m playwright install --with-deps chromium
      - name: 데우기 반복(약 5시간 50분)
        run: |
          end=$(( $(date +%s) + 340*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            timeout 300 python scripts/keep_warm.py || echo "::warning::데우기 실패(다음 차례에 다시)"
            h=$(TZ=Asia/Seoul date +%H)
            if [ "$h" -ge 7 ]; then gap=1200; else gap=2400; fi   # 주간 20분 · 심야(00~06시) 40분
            left=$(( end - $(date +%s) ))
            [ "$left" -le "$gap" ] && break
            sleep "$gap"
          done
      - name: 이어달리기 — 다음 데우기 작업 바로 시작
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run keep_warm.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
