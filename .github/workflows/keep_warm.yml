name: 앱 서버 데워두기

# 2026-10-30(사용자 결정): 앱 저장소를 비공개로 돌리면 Actions 무료 시간(월 2,000분)이 생긴다 → 비밀 값이 없는
# 이 작업은 공개 저장소(홈페이지)로 옮겨 무료로 돌린다. 시간대별(사용자 지시 10-30): 주간 KST 07:00~23:40 20분마다,
# 심야 KST 00:00~06:40 40분마다(00:00·00:40·01:20·02:00 … — cron 은 40분 간격을 직접 못 써서 두 줄로 나눔).
# 실제 브라우저로 앱을 한 번 열어 서버 화면 코드를 돌린다(scripts/keep_warm.py — 원본은 앱 저장소 2026-10-18).
on:
  schedule:
    - cron: "*/20 22,23,0-14 * * *"        # 주간 KST 07:00~23:40, 20분마다
    - cron: "0,40 15,17,19,21 * * *"       # 심야 KST 00:00·00:40·02:00·02:40·04:00·04:40·06:00·06:40
    - cron: "20 16,18,20 * * *"            # 심야 KST 01:20·03:20·05:20 (위와 합쳐 40분마다)
  workflow_dispatch: {}

concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/keep_warm.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q playwright==1.48.0 && python -m playwright install --with-deps chromium
      - run: python scripts/keep_warm.py
