name: 홈페이지 만들기·배포

# 앱 저장소(bandouni33/lotto-shinryeong, 공개)가 내보낸 공개 데이터(site_data/data.json)를 읽어
# 정적 페이지를 만들고 GitHub Pages 로 배포한다. 이 저장소에는 비밀키가 없다.
on:
  push:
    branches: [main]
  schedule:
    # 토요일 21:30·22:20·23:20 KST(공식 발표·등수 확정 뒤) + 매일 09:05 KST
    - cron: "30 12 * * 6"
    - cron: "20 13,14 * * 6"
    - cron: "5 0 * * *"
    # 2026-10-22(사용자 지시 "앱·홈페이지 항상 일치"): 매시간 확인 — 앱 저장소 site_data 가 지난 1시간 안에 바뀐 경우만 새로 만든다
    # (바뀐 게 없으면 만들기·배포·검색엔진 알림을 하지 않는다).
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      go: ${{ steps.c.outputs.go }}
    steps:
      - id: c
        env:
          # 2026-10-30: 앱 저장소 비공개 전환 — 읽기 전용 토큰(Secrets APP_REPO_TOKEN)으로 조회(없으면 기본 토큰)
          GH_TOKEN: ${{ secrets.APP_REPO_TOKEN || github.token }}
          SCHED: ${{ github.event.schedule }}
        run: |
          if [ "$SCHED" != "17 * * * *" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          last=$(gh api "repos/bandouni33/lotto-shinryeong/commits?path=site_data&per_page=1" -q '.[0].commit.committer.date' || echo "")
          if [ -z "$last" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          age=$(( $(date +%s) - $(date -d "$last" +%s) ))
          echo "앱 데이터 마지막 변경: $last (${age}초 전)"
          if [ "$age" -le 3900 ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "go=false" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: check
    if: needs.check.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 앱 저장소의 공개 데이터·그림만 가져오기
        uses: actions/checkout@v4
        with:
          repository: bandouni33/lotto-shinryeong
          token: ${{ secrets.APP_REPO_TOKEN || github.token }}   # 2026-10-30: 비공개 앱 저장소 읽기
          path: app
          sparse-checkout: |
            site_data
            tarot/images
            아이콘815.png
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: 페이지 만들기
        run: python build.py --data app/site_data/data.json --assets app --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - name: 앱 데이터(최신 회차)
        uses: actions/checkout@v4
        with:
          repository: bandouni33/lotto-shinryeong
          path: app
          sparse-checkout: site_data
      - name: 검색엔진에 새 주소 알리기(IndexNow)
        continue-on-error: true
        run: python3 ping_indexnow.py app/site_data/data.json
